---
- name: Guest agent (reports IP/memory to Proxmox)
  hosts: k3s
  become: true
  tasks:
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
      register: guest_agent_install
      retries: 3
      delay: 10
      until: guest_agent_install is succeeded

- name: k3s server
  hosts: server
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -s - server --write-kubeconfig-mode 644 --tls-san {{ ansible_host }}
      args:
        creates: /usr/local/bin/k3s
      register: k3s_server_install
      retries: 3
      delay: 10
      until: k3s_server_install is succeeded

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Fetch kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/k3s.kubeconfig"
        flat: true

- name: k3s agents
  hosts: agent
  become: true
  tasks:
    - name: Install k3s agent
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL=https://{{ hostvars[groups['server'][0]].ansible_host }}:6443
        K3S_TOKEN={{ hostvars[groups['server'][0]].node_token.content | b64decode | trim }}
        sh -s - agent
      args:
        creates: /usr/local/bin/k3s
      register: k3s_agent_install
      retries: 3
      delay: 10
      until: k3s_agent_install is succeeded

- name: Fix kubeconfig server address
  hosts: localhost
  connection: local
  tasks:
    - name: Point kubeconfig at server IP
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/k3s.kubeconfig"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ hostvars[groups['server'][0]].ansible_host }}:6443"
