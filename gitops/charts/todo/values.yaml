replicaCount: 1   # in-memory H2: each replica has its own data, keep at 1

image:
  repository: ghcr.io/sraeburn/todo
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi

service:
  port: 80

ingress:
  enabled: true
  host: todo.k3s.lan

# Scrape /actuator/prometheus with a ServiceMonitor (needs the Prometheus Operator CRDs).
metrics:
  enabled: true
  path: /actuator/prometheus
  # Export http_server_requests_seconds_bucket so Grafana can show p50/p95/p99.
  # Set through SPRING_APPLICATION_JSON, so no image rebuild is needed.
  histogram: true

# Export OTLP traces to Tempo (the app needs 0.4.0+, which ships the OpenTelemetry starter).
tracing:
  enabled: true
  endpoint: http://tempo.tracing:4318/v1/traces
  # Push OTLP metrics (OpenTelemetry HTTP names) to Prometheus's OTLP receiver; empty disables.
  metricsEndpoint: http://monitoring-kube-prometheus-prometheus.monitoring:9090/api/v1/otlp/v1/metrics

# Demo services the API calls to build multi-service traces (needs todo 0.5.0+); empty disables a call.
downstream:
  notifyUrl: http://notify.demo/api/work   # on create
  auditUrl: http://audit.demo/api/work     # on complete and delete
