replicaCount: 1   # in-memory H2: each replica has its own data, keep at 1

image:
  repository: ghcr.io/sraeburn/todo
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi

service:
  port: 80

ingress:
  enabled: true
  host: todo.k3s.lan
