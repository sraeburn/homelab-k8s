apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "todo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: todo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $histogram := and .Values.metrics.enabled .Values.metrics.histogram }}
          {{- if or $histogram .Values.tracing.enabled .Values.downstream.notifyUrl .Values.downstream.auditUrl }}
          env:
            {{- if $histogram }}
            - name: SPRING_APPLICATION_JSON
              value: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'
            {{- end }}
            {{- if .Values.downstream.notifyUrl }}
            - name: TODO_NOTIFY_URL
              value: {{ .Values.downstream.notifyUrl | quote }}
            {{- end }}
            {{- if .Values.downstream.auditUrl }}
            - name: TODO_AUDIT_URL
              value: {{ .Values.downstream.auditUrl | quote }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            # The OpenTelemetry starter also enables OTLP metrics export (default localhost), so point it
            # at Prometheus's OTLP receiver, or turn it off when no endpoint is set.
            {{- if .Values.tracing.metricsEndpoint }}
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
              value: {{ .Values.tracing.metricsEndpoint | quote }}
            {{- else }}
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
