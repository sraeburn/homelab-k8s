apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-web.fullname" . }}
  labels:
    {{- include "hello-web.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hello-web.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 80
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.exporter.port }}
      targetPort: metrics
    {{- end }}
