replicaCount: 5

image:
  repository: nginx
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Spread replicas across nodes. ScheduleAnyway = best effort, so pods still
# schedule if a node is down (DoNotSchedule would leave them Pending).
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

service:
  port: 80

ingress:
  enabled: true
  host: ""         # empty = match any host (reachable via node IP)
