replicaCount: 2

image:
  repository: nginx
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

service:
  port: 80

ingress:
  enabled: true
  host: ""         # empty = match any host (reachable via node IP)
