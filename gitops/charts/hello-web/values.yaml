replicaCount: 1

image:
  repository: nginx
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Spread replicas across nodes. ScheduleAnyway = best effort, so pods still
# schedule if a node is down (DoNotSchedule would leave them Pending).
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

service:
  port: 80

ingress:
  enabled: true
  host: ""         # empty = match any host (reachable via node IP)

# Prometheus metrics: nginx stub_status (port 8081, localhost only) scraped by an
# nginx-prometheus-exporter sidecar, plus a ServiceMonitor.
metrics:
  enabled: false
  exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    port: 9113
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi

# Argo Rollouts canary (no traffic routing: weights are approximated by pod
# counts, so with few replicas the steps round). Override per environment.
rollout:
  steps:
    - setWeight: 50
    - pause: {duration: 30s}
    - setWeight: 100

# Route the canary by weight through a Traefik TraefikService instead of by pod
# count, so small weights (e.g. 5%) work at any replica count. Replaces the
# Ingress with a Traefik IngressRoute and adds a canary Service plus a
# Prometheus error-rate check against Traefik's metrics.
  trafficRouting:
    enabled: false
  analysis:
    maxErrorRatio: 0.05
    prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring:9090
