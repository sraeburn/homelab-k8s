# Customizes the Traefik that k3s ships (applied by the k3s helm controller).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.45
    tracing:
      sampleRate: 1.0
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://tempo.tracing:4318/v1/traces
    # Scraped by Prometheus (per-service request counts, used by the hello-web
    # canary analysis).
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
