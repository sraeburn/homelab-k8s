apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.1.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/gitops/monitoring/values.yaml
    - repoURL: https://github.com/sraeburn/homelab-k8s.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sraeburn/homelab-k8s.git
      targetRevision: main
      path: gitops/monitoring/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # prometheus-operator CRDs exceed the client-side annotation limit
