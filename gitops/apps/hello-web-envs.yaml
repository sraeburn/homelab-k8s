# One template, two environments: generates Applications hello-web-dev and
# hello-web-prod from the same chart, each in its own namespace.
# To add an environment, add an element to the list below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-web-envs
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            replicas: "2"
            host: dev.hello.k3s.lan
            tag: "1.29"
            routed: "false"
            steps: '[{"experiment":{"duration":"1m","templates":[{"name":"experiment","specRef":"canary"}]}},{"setWeight":50},{"pause":{"duration":"30s"}},{"setWeight":100}]'
          - env: prod
            replicas: "4"
            host: prod.hello.k3s.lan
            tag: "1.28"
            routed: "true"
            steps: '[{"setWeight":5},{"pause":{}},{"setWeight":50},{"pause":{"duration":"2m"}},{"setWeight":100}]'
  template:
    metadata:
      name: 'hello-web-{{ .env }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/sraeburn/homelab-k8s.git
        targetRevision: main
        path: gitops/charts/hello-web
        helm:
          parameters:
            - name: replicaCount
              value: '{{ .replicas }}'
            - name: ingress.host
              value: '{{ .host }}'
            - name: image.tag
              value: '{{ .tag }}'
            - name: metrics.enabled
              value: 'true'
          values: |
            rollout:
              steps: {{ .steps }}
              trafficRouting:
                enabled: {{ .routed }}
      destination:
        server: https://kubernetes.default.svc
        namespace: 'hello-{{ .env }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
