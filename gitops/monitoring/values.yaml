# Helm values for kube-prometheus-stack, managed by the "monitoring"
# Application in gitops/apps/monitoring.yaml.
#
# Grafana admin login comes from the hand-created Secret grafana-admin
# (keys admin-user, admin-password) in the monitoring namespace.
alertmanager:
  enabled: false

# k3s embeds these components, so the chart's scrape targets would stay down.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheusOperator:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # Select every ServiceMonitor / PodMonitor / rule / probe in all namespaces,
    # not only those carrying this release's Helm labels.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.k3s.lan
    path: /
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
