# Generated by a script; edit the dashboard in Grafana or regenerate rather than hand-editing.
# Needs a traffic-routed rollout (canary Service named <rollout>-canary) and Traefik metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rollout-canary-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rollout-canary.json: |
    {
      "uid": "rollout-canary",
      "title": "Rollout canary",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "timezone": "",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "argo-rollouts",
        "canary"
      ],
      "annotations": {
        "list": []
      },
      "links": [],
      "description": "Compare a canary against the stable version to decide whether to promote. Traffic and RED metrics come from Traefik's per-service metrics; the canary Service must be named <rollout>-canary (traffic-routed rollouts only).",
      "templating": {
        "list": [
          {
            "name": "ds",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds}"
            },
            "query": {
              "query": "label_values(rollout_info, exported_namespace)",
              "refId": "v"
            },
            "definition": "label_values(rollout_info, exported_namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "hello-prod",
              "value": "hello-prod"
            }
          },
          {
            "name": "rollout",
            "label": "Rollout",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds}"
            },
            "query": {
              "query": "label_values(rollout_info{exported_namespace=\"$namespace\"}, name)",
              "refId": "v"
            },
            "definition": "label_values(rollout_info{exported_namespace=\"$namespace\"}, name)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "hello-web-prod",
              "value": "hello-web-prod"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Promote or abort? Canary at a glance",
          "collapsed": false,
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Rollout phase",
          "description": "Healthy, Paused (waiting for promotion), Progressing, Degraded.",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max by (phase) (rollout_info{exported_namespace=\"$namespace\",name=\"$rollout\"})",
              "legendFormat": "{{phase}}",
              "refId": "A",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "n/a",
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*"
                },
                "properties": []
              }
            ]
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "name",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Pods available / desired",
          "description": "",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max(rollout_info_replicas_available{exported_namespace=\"$namespace\",name=\"$rollout\"})",
              "legendFormat": "available",
              "refId": "A",
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max(rollout_info_replicas_desired{exported_namespace=\"$namespace\",name=\"$rollout\"})",
              "legendFormat": "desired",
              "refId": "B",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "n/a",
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Canary traffic share (5m)",
          "description": "Share of requests that reached the canary. Should track the current setWeight.",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(increase(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[5m])) / (sum(increase(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[5m])) + sum(increase(traefik_service_requests_total{service=~\"$namespace-$rollout-80@.*\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "n/a",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Canary requests (15m)",
          "description": "Sample size. Below ~50 requests the error and latency numbers prove little: red < 50, amber < 200.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(increase(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[15m]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 200
                  }
                ]
              },
              "noValue": "n/a",
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Canary 5xx ratio (5m)",
          "description": "The AnalysisTemplate aborts the rollout above 5%.",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "(sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\",code=~\"5..\"}[5m])) or vector(0)) / (sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[5m])) > 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "noValue": "n/a",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "p95 latency (5m)",
          "description": "Canary vs stable. Similar numbers are what you want.",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"$namespace-$rollout-canary-80@.*\"}[5m])))",
              "legendFormat": "canary",
              "refId": "A",
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"$namespace-$rollout-80@.*\"}[5m])))",
              "legendFormat": "stable",
              "refId": "B",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 15,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "n/a",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Analysis run",
          "description": "Background Prometheus check (canary 5xx ratio). Successful/Running = fine, Failed = aborted.",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "max by (name, phase) (analysis_run_phase{exported_namespace=\"$namespace\",name=~\"$rollout-.*\"} == 1)",
              "legendFormat": "{{phase}}",
              "refId": "A",
              "instant": true
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 19,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "n/a",
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "name",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "row",
          "title": "Traffic by version",
          "collapsed": false,
          "id": 9,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Request rate by version",
          "description": "Requests per second routed to each version (Traefik service metrics).",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-80@.*\"}[$__rate_interval]))",
              "legendFormat": "stable",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[$__rate_interval]))",
              "legendFormat": "canary",
              "refId": "B"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "stable"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "canary"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#FF9830"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Traffic split",
          "description": "100% stacked: how traffic is divided between versions right now.",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-80@.*\"}[$__rate_interval]))",
              "legendFormat": "stable",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "canary",
              "refId": "B"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 40,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "percent",
                  "group": "A"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "stable"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "canary"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#FF9830"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "RED: Rate, Errors, Duration",
          "collapsed": false,
          "id": 12,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Errors: 5xx ratio by version",
          "description": "Fraction of requests answered with 5xx. The red line is the 5% abort threshold.",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "(sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-80@.*\",code=~\"5..\"}[$__rate_interval])) or vector(0)) / (sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-80@.*\"}[$__rate_interval])) > 0)",
              "legendFormat": "stable",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "(sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\",code=~\"5..\"}[$__rate_interval])) or vector(0)) / (sum(rate(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[$__rate_interval])) > 0)",
              "legendFormat": "canary",
              "refId": "B"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "stable"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "canary"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#FF9830"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Requests by status code",
          "description": "Look for codes that appear only on the canary (e.g. 404, 499, 502).",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum by (code) (rate(traefik_service_requests_total{service=~\"$namespace-$rollout-80@.*\"}[$__rate_interval]))",
              "legendFormat": "stable {{code}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "sum by (code) (rate(traefik_service_requests_total{service=~\"$namespace-$rollout-canary-80@.*\"}[$__rate_interval]))",
              "legendFormat": "canary {{code}}",
              "refId": "B"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
