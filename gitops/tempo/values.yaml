# Helm values for the grafana-community/tempo chart, managed by the "tempo"
# Application in gitops/apps/tempo.yaml. Single binary, 7d retention, OTLP in.
tempo:
  retention: 168h
  reportingEnabled: false
  memBallastSizeMbs: 0   # chart default 1024 would exceed the memory limit
  # Service graph metrics (traces_service_graph_*) go to Prometheus for Grafana's service map.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://monitoring-kube-prometheus-prometheus.monitoring:9090/api/v1/write
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs]
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
