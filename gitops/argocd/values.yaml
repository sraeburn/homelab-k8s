# Helm values for ArgoCD itself (argo/argo-cd chart), managed by the
# "argocd" Application in gitops/apps/argocd.yaml.
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# Traefik terminates traffic and talks plain HTTP to argocd-server.
configs:
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.k3s.lan
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

notifications:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

dex:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }
